[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "napier-tables"
version = "0.1.0"
description = "Generate logarithm tables with integer arithmetic."
requires-python = ">=3.14"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
